plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hyperx.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hyperx.client'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}
